# Ядро «Цифрового города» (группа 2): Шлюз, Паспортный стол, Транспорт.
# Запуск: docker network create city   (один раз)
#         docker compose up -d
# Вход в город: http://city.localhost:8080
name: city-core

services:
  # Шлюз: единственная точка входа. Распределяет запросы по районам по имени сайта.
  gateway:
    image: caddy:2.8-alpine
    ports:
      - "127.0.0.1:8080:8080"   # только с этого компьютера
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www:/srv:ro
    read_only: true
    tmpfs:
      - /data
      - /config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]   # бинарник caddy в образе помечен этой capability — без неё не стартует
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    networks:
      city:
        # Районы обращаются к Паспортному столу по тому же адресу, что и браузер, —
        # иначе не совпадёт издатель токена (issuer).
        aliases: [auth.city.localhost]
    restart: unless-stopped

  # Паспортный стол: единый вход (Keycloak). Учебный режим start-dev, данные — во встроенной базе.
  passport:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    env_file: .env
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?задайте KC_ADMIN_PASSWORD в файле .env}
      KC_HOSTNAME: http://auth.city.localhost:8080
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Память Java ограничена долей лимита контейнера (1 ГБ): ноутбуки студентов слабые
      JAVA_OPTS_KC_HEAP: "-XX:InitialRAMPercentage=10 -XX:MaxRAMPercentage=50"
    volumes:
      - ./keycloak/city-realm.json:/opt/keycloak/data/import/city-realm.json:ro
      - passport-data:/opt/keycloak/data
    mem_limit: 1g
    networks:
      city:
        aliases: [passport]
    restart: unless-stopped

  # Транспорт: шина событий NATS. Темы: city.events.<район>.… и city.logs.<район>.
  transport:
    image: nats:2.10-alpine
    command: ["--auth", "${NATS_TOKEN:?задайте NATS_TOKEN в файле .env}"]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    networks:
      city:
        aliases: [nats]
    restart: unless-stopped

networks:
  city:
    external: true

volumes:
  passport-data: {}
